        <audio id="pronunciationAudio" preload="none"></audio>
      </article>

</main>

const STORE='itoeic-vocab-day51-60-v1';
const $=id=>document.getElementById(id);
let settings={day:'ALL',direction:'both',order:'random'};
let progress=loadProgress();
let queue=[], current=null, revealed=false, sessionSeen=new Set();

function key(t){return `${t.w.day}-${t.w.number}-${t.w.word}-${t.dir}`}
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch{return {}}}
function saveProgress(){localStorage.setItem(STORE,JSON.stringify(progress))}
function scope(){return WORDS.filter(w=>settings.day==='ALL'||w.day===settings.day)}
function tasks(){const dirs=settings.direction==='both'?['en-ko','ko-en']:[settings.direction];return scope().flatMap(w=>dirs.map(dir=>({w,dir})))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQueue(){let pending=tasks().filter(t=>progress[key(t)]!=='known');queue=[...pending];if(settings.order==='random')shuffle(queue);if(!queue.length)showComplete();else{hideComplete();nextCard()}updateStats()}
function nextCard(){if(!queue.length){const remaining=tasks().filter(t=>progress[key(t)]!=='known');if(remaining.length){queue=[...remaining];if(settings.order==='random')shuffle(queue)}else{return showComplete()}}current=queue.shift();revealed=false;renderCard();updateStats()}
function renderCard(){if(!current)return;const w=current.w;$('dayPill').textContent=w.day;$('categoryPill').textContent=w.category;$('numberPill').textContent=`No. ${w.number} · ${current.dir==='en-ko'?'영→한':'한→영'}`;const en=current.dir==='en-ko';$('question').textContent=en?w.word:w.meaning;$('answerMain').textContent=en?w.meaning:w.word;$('answerSub').textContent=w.part;$('answer').classList.remove('show');$('hint').textContent=en?'영어 단어의 뜻을 생각해 보세요.':'한국어 뜻에 맞는 영어 단어를 생각해 보세요.';$('hint').style.display='block';$('revealBtn').textContent='정답 확인';$('againBtn').disabled=true;$('knowBtn').disabled=true}
function reveal(){if(!current)return;revealed=true;sessionSeen.add(key(current));$('answer').classList.add('show');$('hint').style.display='none';$('revealBtn').textContent='정답 확인됨';$('againBtn').disabled=false;$('knowBtn').disabled=false;updateStats()}
function judge(known){if(!revealed||!current)return;progress[key(current)]=known?'known':'review';saveProgress();if(!known)queue.push(current);nextCard()}
function updateStats(){const s=tasks(), known=s.filter(t=>progress[key(t)]==='known').length, review=s.filter(t=>progress[key(t)]==='review').length, seen=s.filter(t=>sessionSeen.has(key(t))||progress[key(t)]).length, pct=s.length?Math.round(known/s.length*100):0;$('scopeCount').textContent=s.length;$('seenCount').textContent=seen;$('knownCount').textContent=known;$('reviewCount').textContent=review;$('progressText').textContent=`${known} / ${s.length}문제 암기 완료`;$('progressPercent').textContent=`${pct}%`;$('progressBar').style.width=`${pct}%`}
function showComplete(){$('learning').style.display='none';$('complete').classList.add('show');$('completeText').textContent=settings.direction==='both'?`${scope().length}개 단어를 영어→한국어와 한국어→영어 양방향으로 모두 완료했습니다.`:`${scope().length}개 단어를 모두 암기 완료로 표시했습니다.`;updateStats()}
function hideComplete(){$('learning').style.display='block';$('complete').classList.remove('show')}
function restartScope(){tasks().forEach(t=>delete progress[key(t)]);saveProgress();sessionSeen.clear();buildQueue()}
function initSelect(){const days=[...new Set(WORDS.map(w=>w.day))];$('daySelect').innerHTML=`<option value="ALL">전체 Day 51–60 (${WORDS.length}개)</option>`+days.map(d=>`<option value="${d}">${d} (${WORDS.filter(w=>w.day===d).length}개)</option>`).join('')}
function renderList(q=''){q=q.trim().toLowerCase();const arr=WORDS.filter(w=>(w.word+' '+w.meaning+' '+w.day).toLowerCase().includes(q));$('wordList').innerHTML=arr.map(w=>`<div class="row"><span class="d">${w.day}</span><span class="w">${esc(w.word)}</span><span>${esc(w.meaning)}</span><span class="badge">${esc(w.part)} · ${esc(w.category)}</span></div>`).join('')||'<div class="row">검색 결과가 없습니다.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let voices=[];
function loadVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()}
function browserVoice(text){
  if(!('speechSynthesis'in window)){alert('현재 화면이 음성 재생을 차단했습니다. HTML 파일을 내려받아 Chrome 또는 Edge에서 열어 주세요.');return}
  const u=new SpeechSynthesisUtterance(text);
  const english=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));
  if(english)u.voice=english;
  u.lang='en-US';u.rate=.78;u.pitch=1;u.volume=1;
  speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);
}
function speak(){
  if(!current)return;
  const text=current.w.word;
  const audio=$('pronunciationAudio');
  const btn=$('speakBtn');
  btn.textContent='🔊 재생 중…';
  audio.pause();
  audio.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q='+encodeURIComponent(text);
  audio.currentTime=0;
  let settled=false;
  const fallback=()=>{if(settled)return;settled=true;btn.textContent='🔊 영어 발음 듣기';browserVoice(text)};
  audio.onended=()=>{settled=true;btn.textContent='🔊 영어 발음 듣기'};
  audio.onerror=fallback;
  const playing=audio.play();
  if(playing&&playing.catch)playing.catch(fallback);
  setTimeout(()=>{if(audio.paused&&!settled)fallback()},1500);
}
function setToggle(group,attr,val){settings[attr]=val;[...$(group).querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset[attr]===val));buildQueue()}

$('revealBtn').onclick=reveal;$('againBtn').onclick=()=>judge(false);$('knowBtn').onclick=()=>judge(true);$('speakBtn').onclick=speak;
$('daySelect').onchange=e=>{settings.day=e.target.value;sessionSeen.clear();buildQueue()};
$('direction').onclick=e=>{if(e.target.dataset.dir)setToggle('direction','direction',e.target.dataset.dir)};
$('order').onclick=e=>{if(e.target.dataset.order)setToggle('order','order',e.target.dataset.order)};
$('resetBtn').onclick=()=>{if(confirm('저장된 전체 학습 진도를 초기화할까요?')){progress={};saveProgress();sessionSeen.clear();buildQueue()}};
$('restartBtn').onclick=restartScope;$('search').oninput=e=>renderList(e.target.value);
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.code==='Space'){e.preventDefault();reveal()}else if(e.key==='ArrowLeft')judge(false);else if(e.key==='ArrowRight')judge(true)});
$('sourceTotal').textContent=`총 ${WORDS.length}개 단어`;initSelect();renderList();buildQueue();
loadVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoices;
</script>
